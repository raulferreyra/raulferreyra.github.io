name: Actualizar Lista de Repositorios

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite ejecución manual rápida

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: pip install requests

      - name: Generar tabla de repositorios
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          import requests
          from datetime import datetime

          username = "raulferreyra"
          url = f"https://github.com{username}/repos?per_page=100&sort=updated"
          headers = {}
          
          if os.environ.get('GITHUB_TOKEN'):
              headers["Authorization"] = f"token {os.environ['GITHUB_TOKEN']}"

          response = requests.get(url, headers=headers)
          repos = response.json()

          # Validar que la respuesta sea una lista y no un error de la API
          if not isinstance(repos, list):
              print("Error al consultar la API de GitHub:", repos)
              exit(1)

          # Filtrar: excluir forks y el propio repositorio de la página
          filtered_repos = [r for r in repos if not r.get('fork', False) and r.get('name') != f"{username}.github.io"]

          # Construir la tabla Markdown
          table = "| Nombre | Creación | Última Actualización |\n| :--- | :---: | :---: |\n"
          for r in filtered_repos:
              created = datetime.strptime(r['created_at'], "%Y-%m-%dT%H:%M:%SZ").strftime("%Y-%m-%d")
              updated = datetime.strptime(r['updated_at'], "%Y-%m-%dT%H:%M:%SZ").strftime("%Y-%m-%d")
              
              name_link = f"[{r['name']}]({r['html_url']})"
              desc = f"<br><sub>{r['description']}</sub>" if r['description'] else ""
              
              table += f"| {name_link}{desc} | {created} | {updated} |\n"

          # Leer e inyectar de forma robusta
          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          start_tag = "<!-- REPO-LIST:START -->"
          end_tag = "<!-- REPO-LIST:END -->"

          if start_tag in content and end_tag in content:
              # Dividir el archivo usando las etiquetas como pivotes
              before = content.split(start_tag)[0]
              after = content.split(end_tag)[1]
              
              # Reconstruir el archivo uniendo las piezas de forma limpia
              new_content = f"{before}{start_tag}\n\n{table}\n{end_tag}{after}"
              
              with open("README.md", "w", encoding="utf-8") as f:
                  f.write(new_content)
              print("README.md modificado con éxito localmente.")
          else:
              print("Error: No se encontraron las etiquetas de anclaje en el README.md")
              exit(1)
          EOF

      - name: Auto-confirmar y guardar cambios
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Bot: Lista de repositorios públicos actualizada automáticamente"

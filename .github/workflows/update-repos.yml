name: Actualizar Lista de Repositorios

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite que lo arranques tú mismo con un botón

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: pip install requests

      - name: Generar tabla de repositorios
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          import requests
          from datetime import datetime

          username = "raulferreyra"
          url = f"https://github.com{username}/repos?per_page=100&sort=updated"
          
          print(f"[INFO] Conectando a la API de GitHub: {url}")
          
          headers = {}
          if os.environ.get('GITHUB_TOKEN'):
              headers["Authorization"] = f"token {os.environ['GITHUB_TOKEN']}"
              print("[INFO] Token de autenticación cargado correctamente.")

          response = requests.get(url, headers=headers)
          repos = response.json()

          if not isinstance(repos, list):
              print("[ERROR] La respuesta de la API no es una lista válida:", repos)
              exit(1)

          print(f"[INFO] Se obtuvieron {len(repos)} repositorios totales (públicos + forks).")

          filtered_repos = [r for r in repos if not r.get('fork', False) and r.get('name') != f"{username}.github.io"]
          print(f"[INFO] Filtrados {len(filtered_repos)} repositorios propios (excluyendo forks y portafolio).")

          # Armar la tabla
          table = "| Nombre | Creación | Última Actualización |\n| :--- | :---: | :---: |\n"
          for r in filtered_repos:
              created = datetime.strptime(r['created_at'], "%Y-%m-%dT%H:%M:%SZ").strftime("%Y-%m-%d")
              updated = datetime.strptime(r['updated_at'], "%Y-%m-%dT%H:%M:%SZ").strftime("%Y-%m-%d")
              name_link = f"[{r['name']}]({r['html_url']})"
              desc = f"<br><sub>{r['description']}</sub>" if r['description'] else ""
              table += f"| {name_link}{desc} | {created} | {updated} |\n"

          # Intentar inyectar en el archivo
          print("[INFO] Abriendo el archivo README.md...")
          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          start_tag = "<!-- REPO-LIST:START -->"
          end_tag = "<!-- REPO-LIST:END -->"

          if start_tag in content and end_tag in content:
              print("[INFO] Etiquetas encontradas con éxito. Procediendo a inyectar la tabla...")
              before = content.split(start_tag)[0]
              after = content.split(end_tag)[1]
              
              new_content = f"{before}{start_tag}\n\n{table}\n{end_tag}{after}"
              
              with open("README.md", "w", encoding="utf-8") as f:
                  f.write(new_content)
              print("[OK] ¡README.md reescrito con éxito de forma local!")
          else:
              print("[ERROR] No se encontraron las etiquetas de anclaje. El contenido del README es:")
              print("---")
              print(content)
              print("---")
              exit(1)
          EOF

      - name: Auto-confirmar y guardar cambios
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Bot: Lista de repositorios públicos actualizada automáticamente"

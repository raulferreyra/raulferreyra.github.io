name: Actualizar Lista de Repositorios y Portafolio

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite ejecución manual con el botón Run workflow

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: pip install requests

      - name: Generar tablas de Markdown
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          import requests
          from datetime import datetime

          # ==========================================
          # PARTE 1: ACTUALIZACIÓN DE REPOSITORIOS (RAÍZ)
          # ==========================================
          username = "raulferreyra"
          url = f"https://api.github.com/users/{username}/repos?per_page=100&sort=updated"
          
          print(f"[INFO] Conectando a la API de GitHub: {url}")
          headers = {}
          if os.environ.get('GITHUB_TOKEN'):
              headers["Authorization"] = f"token {os.environ['GITHUB_TOKEN']}"

          response = requests.get(url, headers=headers)
          
          if response.status_code == 200:
              repos = response.json()
              filtered_repos = [r for r in repos if not r.get('fork', False) and r.get('name') != f"{username}.github.io"]
              
              table_repos = "| Nombre | Creación | Última Actualización |\n| :--- | :---: | :---: |\n"
              for r in filtered_repos:
                  created = datetime.strptime(r['created_at'], "%Y-%m-%dT%H:%M:%SZ").strftime("%Y-%m-%d")
                  updated = datetime.strptime(r['updated_at'], "%Y-%m-%dT%H:%M:%SZ").strftime("%Y-%m-%d")
                  name_link = f"[{r['name']}]({r['html_url']})"
                  desc = f"<br><sub>{r['description']}</sub>" if r['description'] else ""
                  table_repos += f"| {name_link}{desc} | {created} | {updated} |\n"

              if os.path.exists("README.md"):
                  with open("README.md", "r", encoding="utf-8") as f:
                      content_raiz = f.read()
                  
                  start_tag = "<!-- REPO-LIST:START -->"
                  end_tag = "<!-- REPO-LIST:END -->"
                  
                  if start_tag in content_raiz and end_tag in content_raiz:
                      before = content_raiz.split(start_tag)[0]
                      after = content_raiz.split(end_tag)[1]
                      new_content = f"{before}{start_tag}\n\n{table_repos}\n{end_tag}{after}"
                      with open("README.md", "w", encoding="utf-8") as f:
                          f.write(new_content)
                      print("[OK] ¡README.md de la raíz actualizado!")
          else:
              print(f"[ERROR] Código {response.status_code} al consultar repositorios.")

          # ==========================================
          # PARTE 2: ESCANEO DE CARPETA PORTOFOLIO E IMÁGENES WEBP
          # ==========================================
          repo_name = f"{username}.github.io"
          base_folder = "portofolio"
          
          if os.path.exists(base_folder):
              print(f"[INFO] Escaneando subcarpetas en '{base_folder}'...")
              
              subfolders = sorted([f for f in os.listdir(base_folder) if os.path.isdir(os.path.join(base_folder, f))])
              
              columns = 3
              table_pics = "| " * columns + "|\n" + "| :---: " * columns + "|\n"
              
              row_cells = []
              for folder in subfolders:
                  folder_path = os.path.join(base_folder, folder)
                  
                  images = [img for img in os.listdir(folder_path) if img.lower().endswith('.webp')]
                  
                  if images:
                      cover_image = sorted(images)[0]
                      img_url = f"https://githubusercontent.com{username}/{repo_name}/main/{base_folder}/{folder}/{cover_image}"
                      folder_url = f"https://github.com/{username}/{repo_name}/tree/main/{base_folder}/{folder}"
                      
                      clean_title = folder.replace("(", " (")
                      
                      cell = f"<a href='{folder_url}'><img src='{img_url}' width='200' alt='{folder}'><br><sub><b>{clean_title}</b></sub></a>"
                      row_cells.append(cell)
                  else:
                      folder_url = f"https://github.com/{username}/{repo_name}/tree/main/{base_folder}/{folder}"
                      cell = f"<a href='{folder_url}'><br>📁 <sub><b>{folder}</b></sub><br>(Sin imágenes .webp)</a>"
                      row_cells.append(cell)

              for i in range(0, len(row_cells), columns):
                  chunk = row_cells[i:i+columns]
                  while len(chunk) < columns:
                      chunk.append("")
                  table_pics += "| " + " | ".join(chunk) + " |\n"

              # Definición global de marcadores HTML para evitar errores NameError
              pic_start = "<!-- REPO-PICTURES:START -->"
              pic_end = "<!-- REPO-PICTURES:END -->"

              portafolio_md_path = os.path.join(base_folder, "README.md")
              if os.path.exists(portafolio_md_path):
                  print(f"[INFO] Leyendo {portafolio_md_path}...")
                  with open(portafolio_md_path, "r", encoding="utf-8") as f:
                      portafolio_content = f.read()
                  
                  if pic_start in portafolio_content and pic_end in portafolio_content:
                      before_pic = portafolio_content.split(pic_start)[0]
                      after_pic = portafolio_content.split(pic_end)[1]
                      
                      new_portafolio_content = f"{before_pic}{pic_start}\n\n{table_pics}\n{pic_end}{after_pic}"
                      
                      with open(portafolio_md_path, "w", encoding="utf-8") as f:
                          f.write(new_portafolio_content)
                      print("[OK] ¡portofolio/README.md modificado con éxito!")
                  else:
                      print("[ERROR] No se encontraron las etiquetas REPO-PICTURES en portofolio/README.md")
              else:
                  print(f"[WARN] No se encontró el archivo {portafolio_md_path}, procediendo a crearlo de forma correcta.")
                  with open(portafolio_md_path, "w", encoding="utf-8") as f:
                      f.write(f"# Mi Portafolio Visual\n\n{pic_start}\n\n{table_pics}\n{pic_end}")
          else:
              print("[ERROR] La carpeta 'portofolio' no existe en la raíz del repositorio.")
          EOF

      - name: Auto-confirmar y guardar cambios
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Bot: Tablas de repositorios e imágenes actualizadas automáticamente"

name: Actualizar Lista de Repositorios y Portafolio

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite ejecución manual con el botón Run workflow

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: pip install requests

      - name: Generar tablas de Markdown
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          import requests
          from urllib.parse import quote
          
          from datetime import datetime

          username = "raulferreyra"
          repo_name = f"{username}.github.io"
          base_folder = "portofolio"
          readme_raiz = "README.md"

          # ==========================================
          # PARTE 1: GENERACIÓN DE LA TABLA DE REPOSITORIOS
          # ==========================================
          url = f"https://api.github.com/users/{username}/repos?per_page=100&sort=updated"
          print(f"[INFO] Conectando a la API de GitHub: {url}")
          
          headers = {}
          if os.environ.get('GITHUB_TOKEN'):
              headers["Authorization"] = f"token {os.environ['GITHUB_TOKEN']}"

          response = requests.get(url, headers=headers)
          table_repos = ""
          
          if response.status_code == 200:
              repos = response.json()
              filtered_repos = [r for r in repos if not r.get('fork', False) and r.get('name') != repo_name]
              
              table_repos = "| Nombre | Creación | Última Actualización |\n| :--- | :---: | :---: |\n"
              for r in filtered_repos:
                  created = datetime.strptime(r['created_at'], "%Y-%m-%dT%H:%M:%SZ").strftime("%Y-%m-%d")
                  updated = datetime.strptime(r['updated_at'], "%Y-%m-%dT%H:%M:%SZ").strftime("%Y-%m-%d")
                  name_link = f"[{r['name']}]({r['html_url']})"
                  desc = f"<br><sub>{r['description']}</sub>" if r['description'] else ""
                  table_repos += f"| {name_link}{desc} | {created} | {updated} |\n"
          else:
              print(f"[ERROR] Código {response.status_code} al consultar repositorios.")

          # ==========================================
          # PARTE 2: GENERACIÓN DE LA GALERÍA VISUAL (.WEBP)
          # ==========================================
          table_pics = ""
          if os.path.exists(base_folder):
              print(f"[INFO] Escaneando subcarpetas en '{base_folder}'...")
              
              # Obtenemos y ordenamos las carpetas de forma limpia
              subfolders = sorted([f for f in os.listdir(base_folder) if os.path.isdir(os.path.join(base_folder, f))])
              
              columns = 3
              # Inicializa el encabezado de la tabla Markdown de 3 columnas
              table_pics = "| " * columns + "|\n" + "| :---: " * columns + "|\n"
              row_cells = []
              
              for folder in subfolders: 
                  folder_path = os.path.join(base_folder, folder)
                  # Filtramos los formatos aceptados
                  images = [img for img in os.listdir(folder_path) if img.lower().endswith(('.webp', '.png', '.jpg', '.jpeg'))]
          
                  safe_base_folder = quote(base_folder)
                  safe_folder = quote(folder)
                  
                  # URL oficial del directorio en GitHub para el enlace interactivo
                  folder_url = f"https://github.com/{username}/{repo_name}/tree/main/{safe_base_folder}/{safe_folder}"
                  clean_title = folder.replace("(", " (")
          
                  if images:
                      # Selecciona la primera imagen alfabéticamente como portada
                      cover_image = sorted(images)[0]
                      safe_image = quote(cover_image)
                      
                      # URL RAW CORRECTA: Se añade '://githubusercontent.com' y la rama estándar '/refs/heads/main/'
                      img_url = f"https://://githubusercontent.com/{username}/{repo_name}/refs/heads/main/{safe_base_folder}/{safe_folder}/{safe_image}"
                      
                      cell = f"<a href='{folder_url}'><img src='{img_url}' width='200' alt='{folder}'><br><sub><b>{clean_title}</b></sub></a>"
                      row_cells.append(cell)
                      
              # Genera la grilla de filas dividiendo los elementos de 3 en 3 de forma exacta
              for i in range(0, len(row_cells), columns):
                  chunk = row_cells[i:i+columns]
                  while len(chunk) < columns:
                      chunk.append("")  # Rellena celdas vacías si el total no es múltiplo de 3
                  table_pics += "| " + " | ".join(chunk) + " |\n"

          # ==========================================
          # PARTE 3: INYECCIÓN UNIFICADA EN EL README PRINCIPAL
          # ==========================================
          if os.path.exists(readme_raiz):
              with open(readme_raiz, "r", encoding="utf-8") as f:
                  content = f.read()

              # Inyectar lista de repositorios si la tabla se generó con éxito
              start_repo = "<!-- REPO-LIST:START -->"
              end_repo = "<!-- REPO-LIST:END -->"
              if table_repos and start_repo in content and end_repo in content:
                  before = content.split(start_repo)[0]
                  after = content.split(end_repo)[1]
                  content = f"{before}{start_repo}\n\n{table_repos}\n{end_repo}{after}"
                  print("[OK] Lista de repositorios preparada en memoria.")

              # Inyectar lista de imágenes del portafolio
              start_pics = "<!-- REPO-PICTURES:START -->"
              end_pics = "<!-- REPO-PICTURES:END -->"
              if table_pics and start_pics in content and end_pics in content:
                  before = content.split(start_pics)[0]
                  after = content.split(end_pics)[1]
                  content = f"{before}{start_pics}\n\n{table_pics}\n{end_pics}{after}"
                  print("[OK] Lista de imágenes del portafolio preparada en memoria.")

              # Guardar todos los cambios unificados de una sola vez
              with open(readme_raiz, "w", encoding="utf-8") as f:
                  f.write(content)
              print("[OK] ¡README.md de la raíz actualizado completamente con ambas tablas!")
          else:
              print("[ERROR] No se encontró el README.md principal en la raíz.")
          EOF

      - name: Auto-confirmar y guardar cambios
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Bot: Actualizados repositorios y portafolio visual en el README principal"
